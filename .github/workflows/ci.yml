name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: SDD and release contracts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Select and validate the active SDD phase
        shell: pwsh
        run: |
          $feature = "specs/00013-system-wide-bug-hunting-audit"
          $tasks = Get-Content -LiteralPath "$feature/tasks.md" -Raw
          if (Test-Path -LiteralPath "$feature/.qc-passed") {
            $phase = if ($tasks -match '(?m)^- \[X\] T415 ') { "release" } else { "qc" }
          } elseif (Test-Path -LiteralPath "$feature/.completed") {
            $phase = if ($tasks -match '(?m)^- \[X\] T404 ') {
              "qc-progress"
            } else {
              "implementation"
            }
          } else {
            $phase = "open"
          }
          python scripts/validate_sdd.py --feature $feature --phase $phase --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate lock and security configuration syntax
        shell: pwsh
        run: |
          Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath PBStudio.UI/packages.lock.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath PBStudio.UI.Tests/packages.lock.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath config/directml-asset-bundle.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath config/pytest-skip-allowlist.json -Raw | ConvertFrom-Json | Out-Null
          python -m py_compile scripts/validate_sdd.py scripts/security_gate.py scripts/generate_release_provenance.py

  python-quality:
    name: Python 3.11 quality gate
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the exact Windows dependency graph
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Verify CPU-only PyTorch runtime
        run: python scripts/verify_cpu_torch_runtime.py

      - name: Run software tests, coverage, skip and temp gates
        shell: pwsh
        run: >-
          ./scripts/run_python_quality_gate.ps1
          -PythonExe (Get-Command python).Source
          -ArtifactDirectory artifacts/python-quality
          -MarkerExpression "not gpu and not integration"

      - name: Upload Python receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-quality
          path: artifacts/python-quality/
          if-no-files-found: error

  windows-native:
    name: Native C# tests and WPF Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "9.0.316"

      - name: Locked restore
        run: |
          dotnet restore PBStudio.UI/PBStudio.UI.csproj --locked-mode
          dotnet restore PBStudio.UI.Tests/PBStudio.UI.Tests.csproj --locked-mode

      - name: Build WPF Release with warnings as errors
        run: >-
          dotnet build PBStudio.UI/PBStudio.UI.csproj
          --configuration Release
          --no-restore
          --nologo
          -p:TreatWarningsAsErrors=true

      - name: Run native tests
        run: >-
          dotnet test PBStudio.UI.Tests/PBStudio.UI.Tests.csproj
          --configuration Release
          --no-restore
          --nologo
          --logger "trx;LogFileName=native-tests.trx"
          --results-directory artifacts/native-tests
          -p:TreatWarningsAsErrors=true

      - name: Validate native test receipt
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -LiteralPath artifacts/native-tests -Filter *.trx)
          if ($reports.Count -ne 1) {
            throw "Expected exactly one native TRX report, found $($reports.Count)."
          }
          [xml]$trx = Get-Content -LiteralPath $reports[0].FullName -Raw
          $counters = $trx.SelectSingleNode(
            "/*[local-name()='TestRun']/*[local-name()='ResultSummary']/*[local-name()='Counters']"
          )
          if ($null -eq $counters) { throw "Native TRX counters are missing." }
          $total = [int]$counters.GetAttribute("total")
          $passed = [int]$counters.GetAttribute("passed")
          if ($total -lt 28 -or $passed -lt 28) {
            throw "Native test discovery floor failed: total=$total passed=$passed."
          }
          foreach ($name in @("failed", "error", "timeout", "aborted")) {
            if ([int]$counters.GetAttribute($name) -ne 0) {
              throw "Native test failure counter $name is non-zero."
            }
          }

      - name: Upload native receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-tests
          path: artifacts/native-tests/
          if-no-files-found: error
