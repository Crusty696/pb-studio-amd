[pytest]
testpaths = Tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
pythonpath = src .
addopts = -v --tb=short --strict-markers --basetemp=.pytest_tmp_cov --timeout=20 --ignore=Tests/test_gpu_load_fallback.py --ignore=Tests/test_gpu_temperature_fallback.py --ignore=Tests/test_separator.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external resources
    gpu: marks tests requiring GPU/DirectML
