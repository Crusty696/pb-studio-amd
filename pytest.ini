[pytest]
testpaths = Tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
pythonpath = src .
# --basetemp ist hier PFLICHT, nicht Bequemlichkeit:
# ohne die Option legt pytest unter %TEMP%\pytest-of-<user>\ einen
# "pytest-current"-SYMLINK an. Das braucht unter Windows Entwicklermodus oder
# Adminrechte; auf dieser Maschine scheitert jeder Lauf sofort mit
# "PermissionError: [WinError 5] ... pytest-current" (verifiziert 2026-08-29).
#
# ACHTUNG (Audit 2026-08-29, C-16): der Pfad ist relativ und fuer ALLE Laeufe
# derselbe, und pytest LOESCHT ein vorhandenes --basetemp beim Sessionstart
# vollstaendig. Zwei gleichzeitige pytest-Prozesse zerstoeren sich damit
# gegenseitig die tmp_path-Verzeichnisse. Symptom: FileNotFoundError in Tests,
# die isoliert gruen laufen.
# => Wer parallel testet (zweites Terminal, IDE-Runner, Agenten-Lauf), MUSS
#    ein eigenes --basetemp uebergeben, z.B. --basetemp=.pytest_tmp_<zweck>.
addopts = -v --tb=short --strict-markers --basetemp=.pytest_tmp2
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external resources
    gpu: marks tests requiring GPU/DirectML
    unauthorized_backend: disables automatic owner authorization for backend boundary tests
