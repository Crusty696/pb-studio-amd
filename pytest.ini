[pytest]
testpaths = Tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
pythonpath = src .
addopts = -v --tb=short --strict-markers --basetemp=.pytest_tmp2
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external resources
    gpu: marks tests requiring GPU/DirectML
